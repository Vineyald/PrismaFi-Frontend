<header class="site-header__bar container container--wide">
  <a class="site-header__brand" routerLink="/" (click)="closeMenu()">
    <app-brand-mark />
    PrismaFi
  </a>

  <button
    #toggle
    class="site-header__toggle"
    type="button"
    aria-controls="site-menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span class="visually-hidden">Menu</span>
    <svg class="site-header__toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
      @if (menuOpen()) {
        <path d="M6 6l12 12M18 6 6 18" />
      } @else {
        <path d="M4 8h16M4 16h16" />
      }
    </svg>
  </button>

  <div class="site-header__menu" id="site-menu">
    <nav aria-label="Main">
      <ul class="site-header__links">
        @for (section of sections; track section.fragment) {
          <li>
            <a
              class="site-header__link"
              routerLink="/"
              [fragment]="section.fragment"
              (click)="closeMenu()"
            >
              {{ section.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
    @if (!auth.isAuthenticated()) {
      <div class="site-header__actions">
        <a app-button variant="ghost" size="small" routerLink="/login">Sign in</a>
        <a app-button size="small" routerLink="/register">Create account</a>
      </div>
    }
  </div>
</header>
