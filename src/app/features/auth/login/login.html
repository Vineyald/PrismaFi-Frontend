<section class="auth-card" aria-labelledby="login-title">
  <header>
    <h1 id="login-title">Sign in</h1>
    <p class="lead">Welcome back to PrismaFi.</p>
  </header>

  @if (failure(); as failure) {
    <app-inline-alert>{{ failure }}</app-inline-alert>
  } @else if (noticeMessage(); as notice) {
    <app-inline-alert [variant]="notice.variant">{{ notice.text }}</app-inline-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-form-field
      label="Email"
      type="email"
      autocomplete="email"
      [control]="form.controls.email"
    />
    <app-form-field
      label="Password"
      type="password"
      autocomplete="current-password"
      [control]="form.controls.password"
    />
    <button app-button type="submit" [loading]="pending()">
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">New to PrismaFi? <a routerLink="/register">Create an account</a></p>
</section>
