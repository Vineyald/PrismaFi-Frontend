<section class="home">
  <div class="home__content container container--narrow">
    <p class="home__eyebrow">Financial control, in one place</p>
    <h1 class="home__title">PrismaFi</h1>
    <p class="home__lead">
      Accounts, bills, transactions and payments, together. The foundation is ready.
    </p>

    <div class="home__status">
      <div
        class="api-status"
        [class.api-status--online]="apiStatus() === 'online'"
        [class.api-status--offline]="apiStatus() === 'offline'"
        role="status"
      >
        <span class="api-status__dot" aria-hidden="true"></span>
        @switch (apiStatus()) {
          @case ('checking') {
            <span>Checking API…</span>
          }
          @case ('online') {
            <span>API online</span>
          }
          @case ('offline') {
            <span>API offline</span>
          }
        }
      </div>
      @if (showRetry()) {
        <button
          app-button
          type="button"
          variant="ghost"
          class="home__retry"
          [loading]="health.isLoading()"
          (click)="retry()"
        >
          Retry
        </button>
      }
    </div>
  </div>
</section>
