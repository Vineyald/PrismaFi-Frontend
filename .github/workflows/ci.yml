name: CI

on:
  pull_request:
  push:
    branches: [dev, hml, prod]

# Read-only token: CI only checks out and tests code.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Playwright uses the Google Chrome preinstalled on the runner (channel: 'chrome').
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
